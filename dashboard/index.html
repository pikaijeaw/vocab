<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HSK Learning Dashboard</title>
<style>
:root{--bg:#f6f7fb;--card:#fff;--ink:#1d2433;--mute:#6b7487;--line:#e3e7ef;--brand:#d6402f;--brand2:#2f6bd6;--ok:#1f9d6b;--warn:#e0a01b;--bad:#d6402f;--shadow:0 2px 10px rgba(20,30,60,.07)}
@media (prefers-color-scheme:dark){:root{--bg:#12151d;--card:#1b2030;--ink:#e8ecf5;--mute:#98a1b6;--line:#2a3147;--shadow:none}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,"Segoe UI","Noto Sans Thai","Microsoft YaHei",sans-serif}
header{background:var(--card);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}
.wrap{max-width:1100px;margin:0 auto;padding:0 16px}
.top{display:flex;align-items:center;gap:16px;flex-wrap:wrap;padding:10px 0}
.logo{font-weight:800;font-size:18px}.logo b{color:var(--brand)}
nav{display:flex;gap:4px;flex-wrap:wrap}
nav button{border:0;background:none;color:var(--mute);font:inherit;font-weight:600;padding:8px 14px;border-radius:8px;cursor:pointer}
nav button.on{background:var(--brand);color:#fff}
.filters{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:0 0 10px;font-size:14px}
.chip{display:inline-flex;align-items:center;gap:4px;border:1px solid var(--line);border-radius:999px;padding:3px 10px;cursor:pointer;user-select:none;background:var(--card)}
.chip.on{background:var(--brand2);color:#fff;border-color:var(--brand2)}
select,input[type=search],input[type=number]{font:inherit;padding:6px 10px;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--ink)}
main{padding:20px 0 60px}
.grid{display:grid;gap:14px}
.g4{grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}
.card{background:var(--card);border-radius:14px;padding:18px;box-shadow:var(--shadow);border:1px solid var(--line)}
.stat .n{font-size:30px;font-weight:800}.stat .l{color:var(--mute);font-size:13px}
h2{margin:22px 0 10px;font-size:18px}
.bar{height:10px;background:var(--line);border-radius:6px;overflow:hidden;display:flex}
.bar i{display:block;height:100%}
.lv{display:grid;grid-template-columns:70px 1fr 160px;gap:10px;align-items:center;margin:10px 0;font-size:14px}
.lv span:last-child{color:var(--mute);text-align:right}
.btn{border:0;border-radius:10px;padding:10px 18px;font:inherit;font-weight:700;cursor:pointer;background:var(--brand2);color:#fff}
.btn.alt{background:var(--card);color:var(--ink);border:1px solid var(--line)}
.btn.ok{background:var(--ok)}.btn.bad{background:var(--bad)}.btn.warn{background:var(--warn)}
.fc{max-width:620px;margin:0 auto;text-align:center}
.face{min-height:320px;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:8px;cursor:pointer}
.hz{font-size:96px;line-height:1.1;font-family:"Noto Sans SC","Microsoft YaHei","SimSun",sans-serif}
.py{font-size:28px;color:var(--brand2)}.th{font-size:30px;font-weight:700}.en{color:var(--mute);font-size:15px;max-width:520px}
.tag{font-size:12px;color:var(--mute)}
.row{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:14px}
.opts{display:grid;gap:10px;margin-top:16px}
.opt{text-align:left;padding:14px;border-radius:12px;border:2px solid var(--line);background:var(--card);color:var(--ink);font:inherit;font-size:20px;cursor:pointer}
.opt:hover{border-color:var(--brand2)}.opt.right{border-color:var(--ok);background:rgba(31,157,107,.15)}.opt.wrong{border-color:var(--bad);background:rgba(214,64,47,.12)}
table{width:100%;border-collapse:collapse;font-size:15px}
th,td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
th{color:var(--mute);font-size:12px;text-transform:uppercase;position:sticky;top:0;background:var(--card)}
td.h{font-size:22px;font-family:"Noto Sans SC","Microsoft YaHei",sans-serif}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;background:var(--line)}
.sp{background:none;border:0;cursor:pointer;font-size:18px}
.pager{display:flex;gap:10px;align-items:center;justify-content:center;margin-top:12px}
.empty{padding:40px;text-align:center;color:var(--mute)}
.kbd{font-size:12px;color:var(--mute);margin-top:10px}
@media(max-width:600px){.hz{font-size:72px}.lv{grid-template-columns:50px 1fr}.lv span:last-child{display:none}}
</style>
</head>
<body>
<header><div class="wrap">
 <div class="top">
  <div class="logo">汉语 <b>HSK</b> Dashboard</div>
  <nav id="nav">
   <button data-v="dash" class="on">Dashboard</button><button data-v="cards">Flashcards</button><button data-v="quiz">Quiz</button><button data-v="browse">Browse</button>
  </nav>
 </div>
 <div class="filters" id="filters"></div>
</div></header>
<main class="wrap" id="app"></main>

<script src="data.js"></script>
<script>
(()=>{
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const DAY=864e5, BOXES=[0,1,2,4,8,16,32]; // days until next review per Leitner box
const WORDS=window.HSK_DATA.map((r,i)=>({id:i,o:+r[0]||0,n:+r[1]||0,hz:r[2],tr:r[3],py:r[4],th:r[5],pos:r[6],en:r[7]}));

const load=(k,d)=>{try{return JSON.parse(localStorage.getItem(k))??d}catch{return d}};
const save=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch{}};
let S=Object.assign({sys:'new',lv:[1,2,3,4,5,6],newPerDay:20,goal:30},load('hsk_settings',{}));
let P=load('hsk_progress',{});          // id -> {b:box,d:due,s:seen,c:correct,w:wrong}
let L=load('hsk_log',{});               // yyyy-mm-dd -> reviews
const today=()=>new Date().toISOString().slice(0,10);
const saveAll=()=>{save('hsk_settings',S);save('hsk_progress',P);save('hsk_log',L)};
const lvOf=w=>S.sys==='old'?w.o:w.n;
const pool=()=>WORDS.filter(w=>lvOf(w)&&S.lv.includes(lvOf(w)));
let view='dash';

function record(w,res){ // res: 0 again,1 good,2 easy
  const p=P[w.id]||{b:0,d:0,s:0,c:0,w:0};
  p.s++; if(res===0){p.b=Math.max(1,p.b>0?p.b-1:1);p.w++;} else {p.b=Math.min(6,(p.b||0)+res);p.c++;}
  p.d=Date.now()+(res===0?0.007:BOXES[p.b])*DAY; // "again" returns in ~10 min
  P[w.id]=p; L[today()]=(L[today()]||0)+1; saveAll();
}
function speak(t){try{const u=new SpeechSynthesisUtterance(t);u.lang='zh-CN';u.rate=.8;speechSynthesis.cancel();speechSynthesis.speak(u)}catch{}}

// ---------- filters ----------
function renderFilters(){
  $('#filters').innerHTML=
   `<span>List:</span><select id="sys"><option value="new"${S.sys==='new'?' selected':''}>New HSK 3.0</option><option value="old"${S.sys==='old'?' selected':''}>Old HSK 2.0</option></select>`+
   [1,2,3,4,5,6].map(l=>`<span class="chip${S.lv.includes(l)?' on':''}" data-l="${l}">HSK ${l}</span>`).join('')+
   `<span style="color:var(--mute)">${pool().length} words</span>`;
  $('#sys').onchange=e=>{S.sys=e.target.value;saveAll();go(view)};
  document.querySelectorAll('.chip').forEach(c=>c.onclick=()=>{const l=+c.dataset.l;S.lv=S.lv.includes(l)?S.lv.filter(x=>x!==l):[...S.lv,l].sort();saveAll();go(view)});
}
document.querySelectorAll('#nav button').forEach(b=>b.onclick=()=>go(b.dataset.v));
function go(v){view=v;document.querySelectorAll('#nav button').forEach(b=>b.classList.toggle('on',b.dataset.v===v));renderFilters();({dash,cards,quiz,browse})[v]();}

// ---------- dashboard ----------
function stage(id){const p=P[id];if(!p||!p.s)return 0;return p.b>=4?3:p.b>=2?2:1} // 0 new,1 learning,2 familiar,3 mastered
function dash(){
  const pl=pool(),now=Date.now();
  const cnt=[0,0,0,0];pl.forEach(w=>cnt[stage(w.id)]++);
  const due=pl.filter(w=>P[w.id]&&P[w.id].s&&P[w.id].d<=now).length;
  const seenAll=Object.values(P).filter(p=>p.s).length;
  let streak=0;for(let d=new Date();;d.setDate(d.getDate()-1)){const k=d.toISOString().slice(0,10);if(L[k])streak++;else if(k===today())continue;else break;}
  const t=L[today()]||0;
  const acc=(()=>{let c=0,w=0;Object.values(P).forEach(p=>{c+=p.c;w+=p.w});return c+w?Math.round(100*c/(c+w)):0})();
  let h=`<div class="grid g4">
   <div class="card stat"><div class="n">${t}<small style="font-size:15px;color:var(--mute)"> / ${S.goal}</small></div><div class="l">reviews today (goal)</div><div class="bar" style="margin-top:8px"><i style="width:${Math.min(100,100*t/S.goal)}%;background:var(--ok)"></i></div></div>
   <div class="card stat"><div class="n">${due}</div><div class="l">cards due for review</div></div>
   <div class="card stat"><div class="n">${streak} 🔥</div><div class="l">day streak</div></div>
   <div class="card stat"><div class="n">${acc}%</div><div class="l">accuracy · ${seenAll} words studied</div></div>
  </div>
  <div class="row" style="justify-content:flex-start"><button class="btn" onclick="HSKgo('cards')">Start flashcards</button><button class="btn alt" onclick="HSKgo('quiz')">Take a quiz</button>
   <label style="margin-left:auto;font-size:14px;color:var(--mute)">Daily goal <input type="number" id="goal" min="5" max="500" value="${S.goal}" style="width:80px"></label>
   <label style="font-size:14px;color:var(--mute)">New cards/day <input type="number" id="npd" min="1" max="200" value="${S.newPerDay}" style="width:80px"></label></div>
  <h2>Progress in selected levels</h2>
  <div class="card"><div class="bar" style="height:16px">
   <i style="width:${100*cnt[3]/pl.length}%;background:var(--ok)" title="Mastered"></i><i style="width:${100*cnt[2]/pl.length}%;background:#7bc96f" title="Familiar"></i><i style="width:${100*cnt[1]/pl.length}%;background:var(--warn)" title="Learning"></i></div>
   <div class="tag" style="margin-top:8px">🟢 mastered ${cnt[3]} · 🟩 familiar ${cnt[2]} · 🟨 learning ${cnt[1]} · ⬜ new ${cnt[0]}</div></div>
  <h2>By level (${S.sys==='new'?'HSK 3.0':'HSK 2.0'})</h2><div class="card">`;
  for(let l=1;l<=6;l++){
    const ws=WORDS.filter(w=>lvOf(w)===l),c=[0,0,0,0];ws.forEach(w=>c[stage(w.id)]++);
    h+=`<div class="lv"><b>HSK ${l}</b><div class="bar"><i style="width:${100*c[3]/ws.length}%;background:var(--ok)"></i><i style="width:${100*c[2]/ws.length}%;background:#7bc96f"></i><i style="width:${100*c[1]/ws.length}%;background:var(--warn)"></i></div><span>${c[1]+c[2]+c[3]} / ${ws.length} studied</span></div>`;
  }
  h+=`</div><h2>Last 14 days</h2><div class="card"><div style="display:flex;align-items:flex-end;gap:6px;height:90px">`;
  const days=[...Array(14)].map((_,i)=>{const d=new Date();d.setDate(d.getDate()-13+i);return d.toISOString().slice(0,10)});
  const mx=Math.max(1,...days.map(d=>L[d]||0));
  h+=days.map(d=>`<div title="${d}: ${L[d]||0}" style="flex:1;text-align:center;font-size:10px;color:var(--mute)"><div style="background:var(--brand2);border-radius:4px;height:${Math.max(2,70*(L[d]||0)/mx)}px;margin-bottom:3px"></div>${d.slice(8)}</div>`).join('');
  h+=`</div></div><p class="tag">Progress is saved in this browser (localStorage). <a href="#" id="reset">Reset all progress</a></p>`;
  $('#app').innerHTML=h;
  $('#goal').onchange=e=>{S.goal=Math.max(5,+e.target.value||30);saveAll();dash()};
  $('#npd').onchange=e=>{S.newPerDay=Math.max(1,+e.target.value||20);saveAll()};
  $('#reset').onclick=e=>{e.preventDefault();if(confirm('Erase all progress?')){P={};L={};saveAll();dash()}};
}
window.HSKgo=go;

// ---------- flashcards ----------
let fc={q:[],i:0,flip:false,newShown:0};
const shuffle=a=>{for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
function buildQueue(){
  const pl=pool(),now=Date.now();
  const due=pl.filter(w=>P[w.id]&&P[w.id].s&&P[w.id].d<=now).sort((a,b)=>P[a.id].d-P[b.id].d);
  const fresh=shuffle(pl.filter(w=>!(P[w.id]&&P[w.id].s))).slice(0,Math.max(0,S.newPerDay-(fc.newShown||0)));
  return [...due.slice(0,200),...fresh];
}
function cards(){ fc={q:buildQueue(),i:0,flip:false,newShown:0}; drawCard(); }
function drawCard(){
  const w=fc.q[fc.i];
  if(!w){$('#app').innerHTML=`<div class="card empty"><div style="font-size:48px">🎉</div><h2>All caught up!</h2><p>No more cards due or new cards for now.<br>Raise “New cards/day” on the dashboard or pick other levels.</p><button class="btn" onclick="HSKgo('dash')">Back to dashboard</button></div>`;return}
  const isNew=!(P[w.id]&&P[w.id].s);
  $('#app').innerHTML=`<div class="fc"><div class="tag">Card ${fc.i+1} / ${fc.q.length} · HSK ${lvOf(w)} ${isNew?'· <b>NEW</b>':''}</div>
  <div class="card face" id="face">${fc.flip?
   `<div class="hz" style="font-size:64px">${esc(w.hz)}</div><div class="py">${esc(w.py)}</div><div class="th">${esc(w.th)}</div><div class="en">${esc(w.en)}</div><div class="tag">${esc(w.pos)}${w.tr!==w.hz?' · '+esc(w.tr):''}</div>`:
   `<div class="hz">${esc(w.hz)}</div><div class="tag">tap or press Space to reveal</div>`}</div>
  <div class="row">${fc.flip?
   `<button class="btn bad" data-r="0">Again (1)</button><button class="btn ok" data-r="1">Good (2)</button><button class="btn warn" data-r="2">Easy (3)</button>`:
   `<button class="btn" id="rev">Show answer</button>`}<button class="btn alt" id="spk">🔊 Listen (S)</button></div>
  <div class="kbd">Keys: Space = flip · 1/2/3 = rate · S = speak</div></div>`;
  $('#face').onclick=()=>{fc.flip=!fc.flip;drawCard()};
  const rv=$('#rev'); if(rv) rv.onclick=()=>{fc.flip=true;drawCard()};
  $('#spk').onclick=()=>speak(w.hz);
  document.querySelectorAll('[data-r]').forEach(b=>b.onclick=()=>rate(+b.dataset.r));
}
function rate(r){const w=fc.q[fc.i];if(!w||!fc.flip)return;const isNew=!(P[w.id]&&P[w.id].s);record(w,r);if(isNew)fc.newShown++;
  if(r===0)fc.q.push(w); fc.i++;fc.flip=false;drawCard();}

// ---------- quiz ----------
let qz={mode:'hz2th',n:0,ok:0,cur:null,done:false};
function quiz(){
  $('#app').innerHTML=`<div class="fc"><div class="card"><h2 style="margin-top:0">Quiz</h2>
   <p>Direction:</p><div class="row" style="margin-top:0">
   <button class="btn" data-m="hz2th">汉字 → Thai</button><button class="btn alt" data-m="th2hz">Thai → 汉字</button><button class="btn alt" data-m="hz2py">汉字 → Pinyin</button><button class="btn alt" data-m="au2hz">🔊 Listen → 汉字</button></div></div></div>`;
  document.querySelectorAll('[data-m]').forEach(b=>b.onclick=()=>{qz={mode:b.dataset.m,n:0,ok:0,cur:null,done:false};nextQ()});
}
function nextQ(){
  const pl=pool(); if(pl.length<4){$('#app').innerHTML='<div class="card empty">Select more levels to quiz.</div>';return}
  const now=Date.now();
  const dueFirst=pl.filter(w=>P[w.id]&&P[w.id].s&&P[w.id].d<=now);
  const src=dueFirst.length&&Math.random()<.5?dueFirst:pl;
  const w=src[Math.random()*src.length|0];
  const key=qz.mode==='hz2th'?'th':qz.mode==='hz2py'?'py':'hz';
  const opts=[w];let guard=0;
  while(opts.length<4&&guard++<200){const c=pl[Math.random()*pl.length|0];if(!opts.some(o=>o[key]===c[key]))opts.push(c)}
  shuffle(opts); qz.cur={w,opts,key,answered:false};
  const q=qz.mode==='hz2th'||qz.mode==='hz2py'?`<div class="hz">${esc(w.hz)}</div>`:qz.mode==='th2hz'?`<div class="th" style="font-size:36px">${esc(w.th)}</div><div class="tag">${esc(w.en)}</div>`:`<button class="btn" id="play" style="font-size:28px">🔊 Play</button>`;
  $('#app').innerHTML=`<div class="fc"><div class="tag">Question ${qz.n+1} · score ${qz.ok}/${qz.n} · <a href="#" id="end">end quiz</a></div>
   <div class="card" style="min-height:140px;display:flex;flex-direction:column;align-items:center;justify-content:center">${q}</div>
   <div class="opts">${opts.map((o,i)=>`<button class="opt${key==='hz'?' hzopt':''}" data-i="${i}"><b style="color:var(--mute)">${i+1}</b>&nbsp; ${key==='hz'?`<span class="hz" style="font-size:34px">${esc(o.hz)}</span>`:esc(o[key])}</button>`).join('')}</div>
   <div id="fb"></div><div class="kbd">Keys: 1–4 to answer · Enter = next</div></div>`;
  document.querySelectorAll('.opt').forEach(b=>b.onclick=()=>answer(+b.dataset.i));
  $('#end').onclick=e=>{e.preventDefault();quiz()};
  const pb=$('#play'); if(pb){pb.onclick=()=>speak(w.hz);speak(w.hz)}
}
function answer(i){
  const c=qz.cur; if(!c||c.answered)return; c.answered=true;
  const o=c.opts[i],ok=o.id===c.w.id;
  document.querySelectorAll('.opt').forEach((b,j)=>{if(c.opts[j].id===c.w.id)b.classList.add('right');else if(j===i)b.classList.add('wrong')});
  qz.n++; if(ok)qz.ok++; record(c.w,ok?1:0);
  $('#fb').innerHTML=`<div class="card" style="margin-top:12px;text-align:center"><span class="hz" style="font-size:40px">${esc(c.w.hz)}</span> <span class="py">${esc(c.w.py)}</span><div class="th" style="font-size:22px">${esc(c.w.th)}</div><div class="en" style="margin:auto">${esc(c.w.en)}</div><div class="row"><button class="btn" id="nx">Next →</button><button class="btn alt" id="sp2">🔊</button></div></div>`;
  $('#nx').onclick=nextQ;$('#sp2').onclick=()=>speak(c.w.hz);
}

// ---------- browse ----------
let br={q:'',page:0,st:'all'};
function browse(){
  const run=()=>{
    const q=br.q.trim().toLowerCase();
    let ws=pool().filter(w=>(br.st==='all'||(br.st==='new'?stage(w.id)===0:stage(w.id)>0))&&(!q||w.hz.includes(q)||w.py.toLowerCase().includes(q)||w.th.includes(q)||w.en.toLowerCase().includes(q)));
    const per=100,pages=Math.max(1,Math.ceil(ws.length/per));br.page=Math.min(br.page,pages-1);
    const cols=['#e3e7ef','#e0a01b','#7bc96f','#1f9d6b'];
    $('#list').innerHTML=ws.length?`<table><thead><tr><th></th><th>汉字</th><th>Pinyin</th><th>Thai</th><th>English</th><th>HSK</th><th></th></tr></thead><tbody>`+
     ws.slice(br.page*per,(br.page+1)*per).map(w=>`<tr><td><span class="dot" style="background:${cols[stage(w.id)]}"></span></td><td class="h">${esc(w.hz)}</td><td>${esc(w.py)}</td><td>${esc(w.th)}</td><td>${esc(w.en)}</td><td>${lvOf(w)}</td><td><button class="sp" data-s="${esc(w.hz)}">🔊</button></td></tr>`).join('')+`</tbody></table>
     <div class="pager"><button class="btn alt" id="pv">‹</button>Page ${br.page+1} / ${pages} · ${ws.length} words<button class="btn alt" id="nxp">›</button></div>`:'<div class="empty">No matches.</div>';
    document.querySelectorAll('[data-s]').forEach(b=>b.onclick=()=>speak(b.dataset.s));
    const pv=$('#pv'),nx=$('#nxp'); if(pv){pv.onclick=()=>{br.page=Math.max(0,br.page-1);run()};nx.onclick=()=>{br.page=Math.min(pages-1,br.page+1);run()}}
  };
  $('#app').innerHTML=`<div class="row" style="justify-content:flex-start;margin:0 0 12px"><input type="search" id="q" placeholder="Search 汉字, pinyin, Thai, English…" style="flex:1;min-width:220px" value="${esc(br.q)}">
   <select id="st"><option value="all">All words</option><option value="new">Not studied yet</option><option value="seen">Studied</option></select></div><div class="card" style="padding:6px 12px;overflow:auto" id="list"></div>`;
  $('#st').value=br.st;
  $('#q').oninput=e=>{br.q=e.target.value;br.page=0;run()};$('#st').onchange=e=>{br.st=e.target.value;br.page=0;run()};
  run();
}

// ---------- keyboard ----------
addEventListener('keydown',e=>{
  if(/INPUT|SELECT|TEXTAREA/.test(e.target.tagName))return;
  if(view==='cards'){
    if(e.code==='Space'){e.preventDefault();if(!fc.flip){fc.flip=true;drawCard()}else rate(1)}
    else if(fc.flip&&'123'.includes(e.key))rate(+e.key-1);
    else if(e.key.toLowerCase()==='s'&&fc.q[fc.i])speak(fc.q[fc.i].hz);
  } else if(view==='quiz'&&qz.cur){
    if('1234'.includes(e.key)&&e.key)answer(+e.key-1);
    else if(e.key==='Enter'&&qz.cur.answered)nextQ();
  }
});

go('dash');
})();
</script>
